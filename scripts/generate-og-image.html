<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background-color: #F5F5F5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
        }
        .logo {
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
        }
        .title {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 16px;
        }
        .subtitle {
            font-size: 24px;
            color: #666;
        }
    </style>
</head>
<body>
    <img src="logo-image.png" class="logo" alt="ひふのこえロゴ">
    <div class="title">ひふのこえ</div>
    <div class="subtitle">肌の声に耳をすませる、わたしの肌ログ</div>
</body>
</html>
