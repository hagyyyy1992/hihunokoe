name: Production Quality Gate

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run all CI checks for main branch deployment
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build test
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL || secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Pre-deployment validation
  pre-deploy-check:
    name: Pre-deployment Validation
    needs: [lint-and-typecheck, build-test, unit-tests]
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.validation.outputs.should-deploy }}
      deploy-reason: ${{ steps.validation.outputs.deploy-reason }}
    steps:
      - name: Validate deployment conditions
        id: validation
        run: |
          echo "Lint & Type Check: ${{ needs.lint-and-typecheck.result }}"
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"

          # Essential checks must pass for deployment
          if [[ "${{ needs.lint-and-typecheck.result }}" == "success" && 
                "${{ needs.build-test.result }}" == "success" && 
                "${{ needs.unit-tests.result }}" == "success" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "deploy-reason=All checks passed" >> $GITHUB_OUTPUT
            echo "✅ All checks passed. Deployment approved."
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "deploy-reason=Essential CI checks failed" >> $GITHUB_OUTPUT
            echo "❌ Essential checks failed. Deployment blocked."
            exit 1
          fi

  # Quality gate summary
  quality-gate:
    name: Production Quality Gate Summary
    needs: [pre-deploy-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Quality gate status
        run: |
          if [[ "${{ needs.pre-deploy-check.outputs.should-deploy }}" == "true" ]]; then
            echo "✅ Quality gate PASSED"
            echo "Reason: ${{ needs.pre-deploy-check.outputs.deploy-reason }}"
            echo ""
            echo "🚀 Vercel will automatically deploy this commit to production"
            echo "📊 Monitor deployment at: https://vercel.com/dashboard"
            echo "🌐 Production URL will be updated automatically"
          else
            echo "❌ Quality gate FAILED"
            echo "Reason: ${{ needs.pre-deploy-check.outputs.deploy-reason }}"
            echo ""
            echo "🚫 Vercel deployment will proceed but with quality issues"
            echo "🔧 Please address the failed checks before next deployment"
            exit 1
          fi

  # Optional: Post-deployment verification (runs after Vercel deploys)
  post-deployment-verification:
    name: Post-deployment Verification
    needs: [quality-gate]
    runs-on: ubuntu-latest
    if: needs.quality-gate.result == 'success'
    continue-on-error: true
    steps:
      - name: Wait for Vercel deployment
        run: |
          echo "⏳ Waiting for Vercel to complete deployment..."
          echo "This typically takes 1-3 minutes for Next.js apps"
          sleep 90

      - name: Verify deployment
        run: |
          echo "🔍 Verifying production deployment..."

          # Example health checks (customize with your actual endpoints)
          echo "📡 Checking API health..."
          # curl -f $PRODUCTION_URL/api/health || echo "⚠️ API health check failed"

          echo "🌐 Checking homepage..."
          # curl -f $PRODUCTION_URL || echo "⚠️ Homepage check failed"

          echo "✅ Basic verification completed"
          echo "💡 Customize this step with your actual production URLs and health checks"
        env:
          # Add your production URL here
          PRODUCTION_URL: 'https://your-app.vercel.app'
