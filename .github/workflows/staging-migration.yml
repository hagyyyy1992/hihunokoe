name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  migrate-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      - name: Verify staging environment
        run: |
          echo "🔍 Verifying this is staging environment..."
          if [[ "${{ secrets.STAGING_DATABASE_URL }}" == *"staging"* ]] || [[ "${{ secrets.STAGING_DATABASE_URL }}" == *"qigivhamiuottlssmmdn"* ]]; then
            echo "✅ Confirmed: Staging environment detected"
          else
            echo "❌ Error: Not a staging environment"
            exit 1
          fi

      - name: Apply Prisma migrations to staging
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      - name: Apply Supabase migrations to staging
        run: |
          supabase link --project-ref ${{ secrets.STAGING_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Seed staging database (optional)
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        continue-on-error: true
