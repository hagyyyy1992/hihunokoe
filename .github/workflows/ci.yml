name: CI - Pull Request Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ci-trigger:
    name: Check CI Trigger
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CI should run
        id: check
        run: |
          echo "Checking if CI should run..."

          # Get all commit messages in this PR
          COMMITS=$(git log --format=%s origin/main..HEAD)

          # Check if any commit message contains [ci] trigger
          if echo "$COMMITS" | grep -q '\[ci\]'; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "✅ CI will run - found [ci] in commit messages"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "⏭️ CI skipped - add [ci] to commit message to run CI"
          fi

          echo "Commit messages:"
          echo "$COMMITS"

  # Show skip message when CI is not triggered
  skip-message:
    name: CI Skipped
    runs-on: ubuntu-latest
    needs: [check-ci-trigger]
    if: needs.check-ci-trigger.outputs.should-run != 'true'
    steps:
      - name: Skip message
        run: |
          echo "⏭️ CI checks were skipped for this PR"
          echo ""
          echo "To run CI checks, include [ci] in your commit message:"
          echo "  Example: 'feat: add new feature [ci]'"
          echo ""
          echo "Note: CI always runs on merges to main branch"
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [check-ci-trigger]
    if: needs.check-ci-trigger.outputs.should-run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate GraphQL types
        run: npm run codegen

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    environment: production
    needs: [check-ci-trigger]
    if: needs.check-ci-trigger.outputs.should-run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate GraphQL types
        run: npm run codegen

      - name: Run build test
        run: npm run build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL || secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [check-ci-trigger]
    if: needs.check-ci-trigger.outputs.should-run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate GraphQL types
        run: npm run codegen

      - name: Run unit tests
        run: npm test

  # Summary job for branch protection rules
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [check-ci-trigger, lint-and-typecheck, build-test, unit-tests]
    if: always() && needs.check-ci-trigger.outputs.should-run == 'true'
    steps:
      - name: Check CI Results
        run: |
          echo "Lint & Type Check: ${{ needs.lint-and-typecheck.result }}"
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"

          # Essential checks must pass
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" || 
                "${{ needs.build-test.result }}" != "success" || 
                "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Essential CI checks failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
          echo "🌐 Vercel Preview Deployment will be available for testing"

  # Optional: Preview deployment verification
  preview-verification:
    name: Preview Deployment Verification
    needs: [check-ci-trigger, ci-status]
    runs-on: ubuntu-latest
    if: needs.check-ci-trigger.outputs.should-run == 'true' && needs.ci-status.result == 'success'
    continue-on-error: true
    steps:
      - name: Wait for Vercel Preview
        run: |
          echo "⏳ Waiting for Vercel Preview Deployment..."
          echo "This typically takes 1-2 minutes for Next.js apps"
          sleep 60

      - name: Preview deployment info
        run: |
          echo "🔍 Vercel Preview Deployment Information:"
          echo "📋 Preview URL: Available in PR comments (auto-generated by Vercel)"
          echo "🤖 Bot comment: Check PR for Vercel bot deployment comment"
          echo "🌐 Format: https://usaka-{hash}-{team}.vercel.app"
          echo ""
          echo "✅ Manual verification recommended:"
          echo "  1. Check Vercel bot comment for Preview URL"
          echo "  2. Test key user flows in Preview environment"
          echo "  3. Verify API endpoints work correctly"
          echo "  4. Check responsive design on different devices"
          echo ""
          echo "💡 Tip: Use Preview URL for stakeholder review before merge"
