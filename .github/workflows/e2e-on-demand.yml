name: E2E Tests (On-Demand)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Test pattern to run (e.g., e2e/auth/** or leave empty for all)'
        required: false
        default: ''
      threshold:
        description: 'Pass rate threshold (0-100)'
        required: false
        default: '85'

jobs:
  check-command:
    name: Check Command
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       contains(github.event.comment.body, '/e2e')) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      test_pattern: ${{ steps.check.outputs.test_pattern }}
      threshold: ${{ steps.check.outputs.threshold }}
    steps:
      - name: Check command and permissions
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // For workflow_dispatch, always run
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_run', 'true');
              core.setOutput('test_pattern', context.payload.inputs.test_pattern || '');
              core.setOutput('threshold', context.payload.inputs.threshold || '85');
              return;
            }

            // For issue comments, check permissions
            const comment = context.payload.comment.body;
            const username = context.payload.comment.user.login;

            // Check if user has write permissions
            const { data: permissionLevel } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: username
            });

            if (!['admin', 'write'].includes(permissionLevel.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ @${username} You don't have permission to run E2E tests. Only collaborators with write access can use this command.`
              });
              core.setOutput('should_run', 'false');
              return;
            }

            // Parse command
            let testPattern = '';
            let threshold = '85';

            if (comment.includes('/e2e')) {
              const match = comment.match(/\/e2e(?:\s+(.+))?/);
              if (match && match[1]) {
                const args = match[1].trim().split(/\s+/);
                testPattern = args[0] || '';
                
                // Check for threshold parameter
                const thresholdMatch = comment.match(/--threshold[=\s]+(\d+)/);
                if (thresholdMatch) {
                  threshold = thresholdMatch[1];
                }
              }
              
              core.setOutput('should_run', 'true');
              core.setOutput('test_pattern', testPattern);
              core.setOutput('threshold', threshold);
              
              // Add reaction to acknowledge command
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
            } else {
              core.setOutput('should_run', 'false');
            }

      - name: Get PR branch
        if: steps.check.outputs.should_run == 'true' && github.event_name == 'issue_comment'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);

  run-e2e-tests:
    name: Run E2E Tests
    needs: check-command
    if: needs.check-command.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.pr.outputs.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Comment test start
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const pattern = '${{ needs.check-command.outputs.test_pattern }}' || 'all tests';
            const threshold = '${{ needs.check-command.outputs.threshold }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `🚀 E2E tests started!\n\n- **Test pattern**: ${pattern}\n- **Pass threshold**: ${threshold}%\n- **Status**: Running...\n\nI'll update this comment when the tests complete.`
            });

      - name: Run E2E tests
        id: test
        run: |
          if [ -n "${{ needs.check-command.outputs.test_pattern }}" ]; then
            npx playwright test "${{ needs.check-command.outputs.test_pattern }}" --reporter=json,line > test-output.json
          else
            node scripts/ci-e2e-runner.js
          fi
        env:
          NODE_ENV: test
          CI: true
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            test-results/
            e2e-threshold-report.json
            test-output.json
          retention-days: 30

      - name: Comment test results
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pattern = '${{ needs.check-command.outputs.test_pattern }}' || 'all tests';
            const threshold = '${{ needs.check-command.outputs.threshold }}';
            const testExitCode = '${{ steps.test.outcome }}';

            let resultMessage = '';

            if (testExitCode === 'success') {
              resultMessage = `✅ **E2E tests passed!**\n\n- **Test pattern**: ${pattern}\n- **Pass threshold**: ${threshold}%\n- **Status**: All tests passed successfully`;
            } else {
              resultMessage = `❌ **E2E tests failed**\n\n- **Test pattern**: ${pattern}\n- **Pass threshold**: ${threshold}%\n- **Status**: Some tests failed\n\nCheck the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;
            }

            // Try to read and parse test results
            try {
              if (fs.existsSync('e2e-threshold-report.json')) {
                const report = JSON.parse(fs.readFileSync('e2e-threshold-report.json', 'utf8'));
                const summary = report.summary;
                
                resultMessage += `\n\n### 📊 Test Summary\n`;
                resultMessage += `- Total tests: ${summary.totalTests}\n`;
                resultMessage += `- Passed: ${summary.totalPassed}\n`;
                resultMessage += `- Failed: ${summary.totalTests - summary.totalPassed}\n`;
                resultMessage += `- Pass rate: ${((summary.totalPassed / summary.totalTests) * 100).toFixed(1)}%\n`;
              }
            } catch (e) {
              // Ignore parsing errors
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: resultMessage
            });
