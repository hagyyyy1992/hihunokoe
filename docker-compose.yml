version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: usaka_postgres
    environment:
      POSTGRES_DB: usaka_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: usaka_adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: usaka_mailhog
    ports:
      - '1025:1025'  # SMTP port
      - '8025:8025'  # Web UI port
    restart: unless-stopped

volumes:
  postgres_data:
